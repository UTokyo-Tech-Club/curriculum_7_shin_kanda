name: ut2-CI test

on:
  push:
    paths:
      - 'ut2/**/*.go'  # utディレクトリ以下のGoファイルに変更があったとき

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.7'

      - name: Run Unit Test
        run: go test ./ut2/...  # utディレクトリ以下のテストを実行