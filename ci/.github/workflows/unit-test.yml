# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Unit Test

on:
  push:
    branches: [ "**" ]
    paths:
      - 'ut/**/*.go'
      - 'ut/go.mod'
      - 'ut/go.sum'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'ut/**/*.go'
      - 'ut/go.mod'
      - 'ut/go.sum'

# 必要な権限を設定
permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ut

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
        cache-dependency-path: ut/go.mod

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
