name: Unit Test

on:
  push:
    paths:
      - 'ut2/**/*.go'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Run Unit Test
        run: go test ./ut2/...